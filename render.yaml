# Render deployment configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: luminee
    env: node
    plan: free
    region: oregon
    buildCommand: |
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      pnpm run build:render
    startCommand: |
      pnpm --filter @workspace/db run push &&
      pnpm --filter @workspace/scripts run seed &&
      node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: luminee-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@luminee.com
      - key: ADMIN_PASSWORD
        generateValue: true
      # Optional: Clerk (leave blank to use email+password auth only)
      - key: CLERK_SECRET_KEY
        value: ""
      - key: CLERK_PUBLISHABLE_KEY
        value: ""
      - key: VITE_CLERK_PUBLISHABLE_KEY
        value: ""

databases:
  - name: luminee-db
    plan: free
    databaseName: luminee
    user: luminee
