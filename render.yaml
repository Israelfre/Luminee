# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: luminee-api
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: npm i -g pnpm@10.33.2 --force && CI=true pnpm install && pnpm --dir artifacts/salon-app run build && pnpm --dir artifacts/api-server run build
    startCommand: sh scripts/start-render.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_SALON_EMAIL
        sync: false
      - key: DEMO_SALON_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      # Opcional: lista de origens permitidas no CORS separadas por vírgula
      # Ex.: https://luminee-api.onrender.com,https://meudominio.com
      # Se não definido, aceita qualquer origem (ok para front servido pelo mesmo serviço)
      - key: ALLOWED_ORIGINS
        sync: false
