# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: luminee-api
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: npm i -g pnpm@10.33.2 --force && CI=true pnpm install --frozen-lockfile && pnpm db:migrate && pnpm --filter @workspace/scripts run seed && pnpm --dir artifacts/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_SALON_EMAIL
        sync: false
      - key: DEMO_SALON_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: web
    name: luminee-front
    runtime: static
    autoDeploy: true
    buildCommand: npm i -g pnpm@10.33.2 --force && CI=true pnpm install --frozen-lockfile && pnpm --dir artifacts/salon-app run build
    staticPublishPath: artifacts/salon-app/dist/public
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: VITE_API_URL
        value: https://luminee-api.onrender.com
